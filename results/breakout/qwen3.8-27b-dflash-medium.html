<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Breakout</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05060f;
    cursor: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;

  // ---------- Audio (tiny synth, no assets) ----------
  let actx = null;
  function beep(freq, dur, type = 'square', vol = 0.12, slide = 0) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, actx.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), actx.currentTime + dur);
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start();
      o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  // ---------- Game state ----------
  const ROWS = 6, COLS = 10;
  const ROW_COLORS = ['#ff3b6b', '#ff9f1c', '#ffe74c', '#3ddc84', '#38b6ff', '#b06bff'];
  const ROW_SCORES = [60, 50, 40, 30, 20, 10];

  let state = 'ready'; // ready | playing | levelcomplete | gameover | win
  let score = 0, lives = 3, level = 1;
  let shake = 0, flash = 0, flashColor = '#fff';
  let time = 0;

  const paddle = { w: 130, h: 14, x: 0, y: 0, vx: 0, targetX: 0 };
  const ball = { x: 0, y: 0, vx: 0, vy: 0, r: 7, speed: 6 };
  let bricks = [];
  let particles = [];
  let trail = [];
  let stars = [];
  let keys = { left: false, right: false };

  function ballSpeed() { return 5.5 + level * 0.9; }

  function makeStars() {
    stars = [];
    for (let i = 0; i < 90; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        s: Math.random() * 1.6 + 0.4,
        p: Math.random() * Math.PI * 2
      });
    }
  }

  function buildBricks() {
    bricks = [];
    const top = 70, side = 40;
    const gap = 8;
    const bw = (W - side * 2 - gap * (COLS - 1)) / COLS;
    const bh = 26;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const hp = r < 2 ? 2 : 1;
        bricks.push({
          x: side + c * (bw + gap),
          y: top + r * (bh + gap),
          w: bw, h: bh,
          hp, maxHp: hp,
          color: ROW_COLORS[r],
          score: ROW_SCORES[r],
          alive: true,
          pulse: Math.random() * Math.PI * 2
        });
      }
    }
  }

  function resetBall() {
    state = 'ready';
    ball.speed = ballSpeed();
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 2;
    ball.vx = 0; ball.vy = 0;
    trail = [];
  }

  function launch() {
    const a = -Math.PI / 2 + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(a) * ball.speed;
    ball.vy = Math.sin(a) * ball.speed;
    state = 'playing';
    beep(440, 0.12, 'triangle', 0.15, 300);
  }

  function newGame() {
    score = 0; lives = 3; level = 1;
    paddle.w = 130;
    paddle.x = W / 2 - paddle.w / 2;
    paddle.y = H - 60;
    paddle.targetX = paddle.x;
    buildBricks();
    particles = [];
    resetBall();
  }

  function nextLevel() {
    level++;
    paddle.w = Math.max(80, 130 - (level - 1) * 8);
    paddle.x = W / 2 - paddle.w / 2;
    paddle.targetX = paddle.x;
    buildBricks();
    resetBall();
  }

  // ---------- Particles ----------
  function burst(x, y, color, n = 22, power = 5) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = Math.random() * power + 1;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 1,
        life: 1,
        decay: 0.015 + Math.random() * 0.025,
        size: Math.random() * 4 + 2,
        color
      });
    }
  }

  // ---------- Input ----------
  window.addEventListener('mousemove', e => {
    paddle.targetX = e.clientX - paddle.w / 2;
  });
  window.addEventListener('touchmove', e => {
    if (e.touches.length) paddle.targetX = e.touches[0].clientX - paddle.w / 2;
    e.preventDefault();
  }, { passive: false });

  window.addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft') keys.left = true;
    if (e.code === 'ArrowRight') keys.right = true;
    if (e.code === 'Space') {
      e.preventDefault();
      if (state === 'ready') launch();
      else if (state === 'gameover' || state === 'win') newGame();
      else if (state === 'levelcomplete') nextLevel();
    }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft') keys.left = false;
    if (e.code === 'ArrowRight') keys.right = false;
  });

  // ---------- Resize ----------
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    paddle.y = H - 60;
    makeStars();
    if (bricks.length) buildBricks();
    if (state === 'ready') resetBall();
  }
  window.addEventListener('resize', resize);

  // ---------- Update ----------
  function update() {
    time += 1 / 60;

    // Paddle
    const keySpeed = 11;
    if (keys.left) { paddle.targetX -= keySpeed; paddle.x -= keySpeed; }
    if (keys.right) { paddle.targetX += keySpeed; paddle.x += keySpeed; }
    if (!keys.left && !keys.right) {
      paddle.x += (paddle.targetX - paddle.x) * 0.35;
    }
    paddle.x = Math.max(8, Math.min(W - paddle.w - 8, paddle.x));

    if (state === 'ready') {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 2;
    }

    if (state === 'playing') {
      // Sub-step for stability
      const steps = 3;
      for (let s = 0; s < steps; s++) {
        ball.x += ball.vx / steps;
        ball.y += ball.vy / steps;

        // Walls
        if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); beep(220, 0.05, 'square', 0.06); }
        if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); beep(220, 0.05, 'square', 0.06); }
        if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); beep(220, 0.05, 'square', 0.06); }

        // Paddle
        if (ball.vy > 0 &&
            ball.y + ball.r >= paddle.y &&
            ball.y - ball.r <= paddle.y + paddle.h &&
            ball.x >= paddle.x - ball.r &&
            ball.x <= paddle.x + paddle.w + ball.r) {
          const rel = Math.max(-1, Math.min(1, (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2)));
          const maxAngle = Math.PI / 3; // 60 degrees
          const angle = -Math.PI / 2 + rel * maxAngle;
          ball.speed = Math.min(ball.speed + 0.05, 13);
          ball.vx = Math.cos(angle) * ball.speed;
          ball.vy = Math.sin(angle) * ball.speed;
          ball.y = paddle.y - ball.r - 0.5;
          beep(330, 0.08, 'triangle', 0.12, 120);
          burst(ball.x, paddle.y, '#7fd8ff', 6, 2.5);
        }

        // Bricks
        for (const b of bricks) {
          if (!b.alive) continue;
          if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
              ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
            const overlapL = ball.x + ball.r - b.x;
            const overlapR = b.x + b.w - (ball.x - ball.r);
            const overlapT = ball.y + ball.r - b.y;
            const overlapB = b.y + b.h - (ball.y - ball.r);
            const min = Math.min(overlapL, overlapR, overlapT, overlapB);
            if (min === overlapT || min === overlapB) ball.vy = -ball.vy;
            else ball.vx = -ball.vx;

            b.hp--;
            b.pulse = 0;
            if (b.hp <= 0) {
              b.alive = false;
              score += b.score;
              shake = Math.min(shake + 7, 14);
              flash = 0.12;
              flashColor = b.color;
              burst(b.x + b.w / 2, b.y + b.h / 2, b.color, 26, 6);
              beep(180 + Math.random() * 60, 0.18, 'sawtooth', 0.14, -100);
              beep(660, 0.1, 'triangle', 0.08, 200);
            } else {
              score += 5;
              shake = Math.min(shake + 3, 8);
              burst(ball.x, ball.y, b.color, 10, 3);
              beep(500, 0.07, 'square', 0.1, 100);
            }
            break;
          }
        }
      }

      // Trail
      trail.push({ x: ball.x, y: ball.y, life: 1 });
      if (trail.length > 24) trail.shift();

      // Lost ball
      if (ball.y > H + 30) {
        lives--;
        shake = 12;
        flash = 0.25;
        flashColor = '#ff3b6b';
        burst(ball.x, H - 10, '#ff3b6b', 30, 6);
        beep(140, 0.4, 'sawtooth', 0.18, -100);
        if (lives <= 0) {
          state = 'gameover';
        } else {
          resetBall();
        }
      }

      // Level complete
      if (bricks.every(b => !b.alive)) {
        state = 'levelcomplete';
        score += 100 * level;
        flash = 0.3;
        flashColor = '#3ddc84';
        for (let i = 0; i < 5; i++) {
          setTimeout(() => burst(Math.random() * W, Math.random() * H * 0.5, ROW_COLORS[i % 6], 30, 7), i * 120);
        }
        beep(523, 0.15, 'triangle', 0.15);
        setTimeout(() => beep(659, 0.15, 'triangle', 0.15), 130);
        setTimeout(() => beep(784, 0.3, 'triangle', 0.15), 260);
      }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.12;
      p.vx *= 0.99;
      p.life -= p.decay;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Trail decay
    for (let i = trail.length - 1; i >= 0; i--) {
      trail[i].life -= 0.05;
      if (trail[i].life <= 0) trail.splice(i, 1);
    }

    // Shake / flash decay
    shake *= 0.88;
    if (shake < 0.2) shake = 0;
    flash = Math.max(0, flash - 0.02);
  }

  // ---------- Draw ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    // Background
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0a0d24');
    g.addColorStop(0.6, '#070917');
    g.addColorStop(1, '#04050c');
    ctx.fillStyle = g;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // Stars
    for (const s of stars) {
      const tw = 0.4 + 0.6 * Math.abs(Math.sin(time * 1.5 + s.p));
      ctx.globalAlpha = tw * 0.7;
      ctx.fillStyle = '#9db4ff';
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;

    // Bricks
    for (const b of bricks) {
      if (!b.alive) continue;
      const damaged = b.hp < b.maxHp;
      const pulse = 0.85 + 0.15 * Math.sin(time * 3 + b.pulse);
      ctx.save();
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 12 * pulse;
      ctx.globalAlpha = damaged ? 0.75 : 1;
      ctx.fillStyle = b.color;
      roundRect(b.x, b.y, b.w, b.h, 5);
      ctx.fill();
      // top highlight
      ctx.shadowBlur = 0;
      ctx.globalAlpha = (damaged ? 0.75 : 1) * 0.35;
      ctx.fillStyle = '#ffffff';
      roundRect(b.x + 3, b.y + 3, b.w - 6, b.h / 2 - 3, 3);
      ctx.fill();
      if (damaged) {
        ctx.globalAlpha = 0.5;
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(b.x + b.w * 0.3, b.y + 2);
        ctx.lineTo(b.x + b.w * 0.45, b.y + b.h * 0.5);
        ctx.lineTo(b.x + b.w * 0.35, b.y + b.h - 2);
        ctx.moveTo(b.x + b.w * 0.45, b.y + b.h * 0.5);
        ctx.lineTo(b.x + b.w * 0.7, b.y + b.h * 0.35);
        ctx.stroke();
      }
      ctx.restore();
    }

    // Trail
    for (let i = 0; i < trail.length; i++) {
      const t = trail[i];
      const a = t.life * 0.5;
      const r = ball.r * t.life * 0.9;
      const rg = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, r * 2.5);
      rg.addColorStop(0, `rgba(140, 220, 255, ${a})`);
      rg.addColorStop(1, 'rgba(140, 220, 255, 0)');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.arc(t.x, t.y, r * 2.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // Ball
    if (state === 'playing' || state === 'ready') {
      ctx.save();
      ctx.shadowColor = '#aee6ff';
      ctx.shadowBlur = 20;
      const bg = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 1, ball.x, ball.y, ball.r);
      bg.addColorStop(0, '#ffffff');
      bg.addColorStop(1, '#7fd8ff');
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Paddle
    ctx.save();
    ctx.shadowColor = '#7fd8ff';
    ctx.shadowBlur = 18;
    const pg = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.h);
    pg.addColorStop(0, '#e8fbff');
    pg.addColorStop(0.5, '#7fd8ff');
    pg.addColorStop(1, '#2a7fb8');
    ctx.fillStyle = pg;
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();
    ctx.restore();

    // Particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size * p.life + 1, p.size * p.life + 1);
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    // Flash
    if (flash > 0) {
      ctx.globalAlpha = flash;
      ctx.fillStyle = flashColor;
      ctx.fillRect(-20, -20, W + 40, H + 40);
      ctx.globalAlpha = 1;
    }

    // HUD
    ctx.textAlign = 'left';
    ctx.font = 'bold 22px "Courier New", monospace';
    ctx.fillStyle = '#e8fbff';
    ctx.shadowColor = '#7fd8ff';
    ctx.shadowBlur = 10;
    ctx.fillText('SCORE ' + score, 24, 40);
    ctx.textAlign = 'center';
    ctx.fillText('LEVEL ' + level, W / 2, 40);
    ctx.textAlign = 'right';
    let hearts = '';
    for (let i = 0; i < lives; i++) hearts += '♥ ';
    ctx.fillStyle = '#ff3b6b';
    ctx.shadowColor = '#ff3b6b';
    ctx.fillText(hearts.trim(), W - 24, 40);
    ctx.shadowBlur = 0;

    // Overlays
    ctx.textAlign = 'center';
    if (state === 'ready') {
      const bob = Math.sin(time * 4) * 6;
      ctx.font = 'bold 26px "Courier New", monospace';
      ctx.fillStyle = '#aee6ff';
      ctx.shadowColor = '#7fd8ff';
      ctx.shadowBlur = 14;
      ctx.fillText('PRESS  SPACE  TO  LAUNCH', W / 2, H * 0.45 + bob);
      ctx.shadowBlur = 0;
      ctx.font = '16px "Courier New", monospace';
      ctx.fillStyle = 'rgba(174,230,255,0.6)';
      ctx.fillText('mouse or ← → to move', W / 2, H * 0.45 + 34 + bob);
    } else if (state === 'levelcomplete') {
      overlay('LEVEL ' + level + ' COMPLETE!', '#3ddc84', 'BONUS +' + (100 * level) + '   —   PRESS SPACE FOR LEVEL ' + (level + 1));
    } else if (state === 'gameover') {
      overlay('GAME OVER', '#ff3b6b', 'FINAL SCORE ' + score + '   —   PRESS SPACE TO RESTART');
    } else if (state === 'win') {
      overlay('YOU WIN!', '#ffe74c', 'FINAL SCORE ' + score + '   —   PRESS SPACE TO PLAY AGAIN');
    }

    ctx.restore();
  }

  function overlay(title, color, sub) {
    ctx.fillStyle = 'rgba(4, 5, 12, 0.72)';
    ctx.fillRect(0, 0, W, H);
    const bob = Math.sin(time * 3) * 8;
    ctx.font = 'bold 56px "Courier New", monospace';
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 30;
    ctx.fillText(title, W / 2, H / 2 - 20 + bob);
    ctx.shadowBlur = 0;
    ctx.font = '20px "Courier New", monospace';
    ctx.fillStyle = 'rgba(232,251,255,0.85)';
    const blink = 0.5 + 0.5 * Math.sin(time * 5);
    ctx.globalAlpha = 0.5 + 0.5 * blink;
    ctx.fillText(sub, W / 2, H / 2 + 40 + bob);
    ctx.globalAlpha = 1;
  }

  // ---------- Loop ----------
  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  resize();
  newGame();
  loop();
})();
</script>
</body>
</html>
