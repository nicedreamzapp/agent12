<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spinning 3D Ball</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0a12;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: grab;
  }
  canvas:active {
    cursor: grabbing;
  }
</style>
</head>
<body>
<canvas id="glcanvas"></canvas>
<script>
(function () {
  "use strict";

  const canvas = document.getElementById("glcanvas");
  const gl = canvas.getContext("webgl2");
  if (!gl) {
    document.body.innerHTML = "<p style='color:#fff;font-family:sans-serif;padding:2em'>WebGL2 not supported.</p>";
    return;
  }

  // ---------- Shaders ----------
  const vsSource = `#version 300 es
  precision highp float;
  layout(location = 0) in vec3 aPosition;
  layout(location = 1) in vec3 aNormal;
  uniform mat4 uModel;
  uniform mat4 uViewProj;
  out vec3 vNormal;
  out vec3 vWorldPos;
  void main() {
    vec4 worldPos = uModel * vec4(aPosition, 1.0);
    vWorldPos = worldPos.xyz;
    vNormal = mat3(uModel) * aNormal;
    gl_Position = uViewProj * worldPos;
  }`;

  const fsSource = `#version 300 es
  precision highp float;
  in vec3 vNormal;
  in vec3 vWorldPos;
  uniform vec3 uLightDir;
  uniform vec3 uLightColor;
  uniform vec3 uBaseColor;
  out vec4 fragColor;
  void main() {
    vec3 N = normalize(vNormal);
    vec3 L = normalize(uLightDir);
    float diff = max(dot(N, L), 0.0);
    float ambient = 0.08;
    // subtle specular to emphasize curvature
    vec3 V = normalize(-vWorldPos);
    vec3 H = normalize(L + V);
    float spec = pow(max(dot(N, H), 0.0), 48.0) * 0.35;
    vec3 color = uBaseColor * (ambient + diff * uLightColor) + vec3(spec);
    fragColor = vec4(color, 1.0);
  }`;

  function compileShader(type, source) {
    const s = gl.createShader(type);
    gl.shaderSource(s, source);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(s));
    }
    return s;
  }

  const program = gl.createProgram();
  gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vsSource));
  gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fsSource));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(program));
  }
  gl.useProgram(program);

  // ---------- Sphere geometry ----------
  // 32 x 32 segments -> 32*32*2 = 2048 triangles
  const SEG_X = 32;
  const SEG_Y = 32;
  const RADIUS = 1.0;

  const positions = [];
  const normals = [];
  const indices = [];

  for (let iy = 0; iy <= SEG_Y; iy++) {
    const v = iy / SEG_Y;
    const phi = v * Math.PI; // 0..PI
    for (let ix = 0; ix <= SEG_X; ix++) {
      const u = ix / SEG_X;
      const theta = u * Math.PI * 2; // 0..2PI
      const x = Math.sin(phi) * Math.cos(theta);
      const y = Math.cos(phi);
      const z = Math.sin(phi) * Math.sin(theta);
      positions.push(x * RADIUS, y * RADIUS, z * RADIUS);
      normals.push(x, y, z);
    }
  }

  for (let iy = 0; iy < SEG_Y; iy++) {
    for (let ix = 0; ix < SEG_X; ix++) {
      const a = iy * (SEG_X + 1) + ix;
      const b = a + SEG_X + 1;
      indices.push(a, b, a + 1);
      indices.push(b, b + 1, a + 1);
    }
  }

  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);

  const posBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);

  const normBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, normBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(normals), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);

  const idxBuf = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices), gl.STATIC_DRAW);

  const indexCount = indices.length;

  // ---------- Uniforms ----------
  const uModel = gl.getUniformLocation(program, "uModel");
  const uViewProj = gl.getUniformLocation(program, "uViewProj");
  const uLightDir = gl.getUniformLocation(program, "uLightDir");
  const uLightColor = gl.getUniformLocation(program, "uLightColor");
  const uBaseColor = gl.getUniformLocation(program, "uBaseColor");

  gl.uniform3f(uLightDir, 0.6, 0.8, 0.5);
  gl.uniform3f(uLightColor, 1.0, 0.97, 0.9);
  gl.uniform3f(uBaseColor, 0.35, 0.55, 0.95);

  gl.enable(gl.DEPTH_TEST);
  gl.clearColor(0.04, 0.04, 0.07, 1.0);

  // ---------- Matrix helpers (column-major) ----------
  function perspective(fov, aspect, near, far) {
    const f = 1.0 / Math.tan(fov / 2);
    const nf = 1 / (near - far);
    return new Float32Array([
      f / aspect, 0, 0, 0,
      0, f, 0, 0,
      0, 0, (far + near) * nf, -1,
      0, 0, 2 * far * near * nf, 0
    ]);
  }

  function lookAt(eye, center, up) {
    const z = norm3(sub3(eye, center));
    const x = norm3(cross3(up, z));
    const y = cross3(z, x);
    return new Float32Array([
      x[0], y[0], z[0], 0,
      x[1], y[1], z[1], 0,
      x[2], y[2], z[2], 0,
      -dot3(x, eye), -dot3(y, eye), -dot3(z, eye), 1
    ]);
  }

  function rotX(a) {
    const c = Math.cos(a), s = Math.sin(a);
    return new Float32Array([1,0,0,0, 0,c,s,0, 0,-s,c,0, 0,0,0,1]);
  }
  function rotY(a) {
    const c = Math.cos(a), s = Math.sin(a);
    return new Float32Array([c,0,-s,0, 0,1,0,0, s,0,c,0, 0,0,0,1]);
  }
  function mul4(a, b) {
    const out = new Float32Array(16);
    for (let c = 0; c < 4; c++) {
      for (let r = 0; r < 4; r++) {
        let sum = 0;
        for (let k = 0; k < 4; k++) sum += a[k * 4 + r] * b[c * 4 + k];
        out[c * 4 + r] = sum;
      }
    }
    return out;
  }
  function sub3(a, b) { return [a[0]-b[0], a[1]-b[1], a[2]-b[2]]; }
  function dot3(a, b) { return a[0]*b[0] + a[1]*b[1] + a[2]*b[2]; }
  function cross3(a, b) {
    return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  }
  function norm3(a) {
    const l = Math.hypot(a[0], a[1], a[2]) || 1;
    return [a[0]/l, a[1]/l, a[2]/l];
  }

  // ---------- Resize ----------
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const w = Math.floor(window.innerWidth * dpr);
    const h = Math.floor(window.innerHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- Interaction ----------
  let angleX = 0.4;
  let angleY = 0;
  let velX = 0;   // rad/s added by dragging
  let velY = 0;
  const BASE_SPIN_Y = 0.35; // slow idle spin
  const BASE_SPIN_X = 0.08;
  const DRAG_SENS = 0.008;
  const DECAY = 0.985;

  let dragging = false;
  let lastX = 0, lastY = 0;

  canvas.addEventListener("pointerdown", (e) => {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    velY += dx * DRAG_SENS;
    velX += dy * DRAG_SENS;
  });
  canvas.addEventListener("pointerup", (e) => {
    dragging = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  });
  canvas.addEventListener("pointercancel", () => { dragging = false; });

  // ---------- Animation loop ----------
  let lastTime = performance.now();

  function frame(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    if (!dragging) {
      velX *= DECAY;
      velY *= DECAY;
    }

    angleY += (BASE_SPIN_Y + velY) * dt;
    angleX += (BASE_SPIN_X + velX) * dt;

    const aspect = canvas.width / canvas.height;
    const viewProj = mul4(lookAt([0, 0, 3.2], [0, 0, 0], [0, 1, 0]),
                          perspective(Math.PI / 4, aspect, 0.1, 100));
    const model = mul4(rotX(angleX), rotY(angleY));

    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.uniformMatrix4fv(uModel, false, model);
    gl.uniformMatrix4fv(uViewProj, false, viewProj);

    gl.bindVertexArray(vao);
    gl.drawElements(gl.TRIANGLES, indexCount, gl.UNSIGNED_SHORT, 0);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
