<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Furry Ball</title>
<style>
* { margin: 0; padding: 0; }
body { background: #000; overflow: hidden; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl2", { antialias: true });
if (!gl) { document.body.textContent = "WebGL2 not supported"; throw 0; }

const NUM_STRANDS = 1000000;
const STRAND_VERTS = 4;
const TOTAL_VERTS = NUM_STRANDS * STRAND_VERTS;

// --- Shaders ---
const VS = `#version 300 es
precision highp float;

layout(location=0) in vec3 aRootPos;
layout(location=1) in vec3 aRootNorm;
layout(location=2) in float aLength;
layout(location=3) in float aPhase;

layout(location=4) in vec2 aLocalPos; // (tangent_offset, length_frac)

uniform sampler2D uBendTex;
uniform float uTime;
uniform mat4 uVP;
uniform vec3 uLightDir;
uniform vec3 uCamPos;

out vec3 vWorldPos;
out float vFog;
out float vBright;

void main() {
    int idx = gl_InstanceID;
    int row = idx / 1000;
    int col = idx % 1000;
    vec4 bendData = texelFetch(uBendTex, ivec2(col, row), 0);
    vec3 bendDir = bendData.xyz;
    float bendTime = bendData.w;
    float bendAmount = clamp(1.0 - (uTime - bendTime) / 0.5, 0.0, 1.0);

    vec3 dir = aRootNorm;
    float len = aLength;
    float phase = aPhase;

    // Vary length slightly per strand
    len *= 0.85 + 0.3 * phase;

    // Deformed strand direction
    vec3 deformedDir = normalize(dir + bendAmount * bendDir * 0.6);

    // Build orthonormal basis
    vec3 tangent;
    if (abs(dir.y) < 0.999) {
        tangent = normalize(cross(dir, vec3(0,1,0)));
    } else {
        tangent = normalize(cross(dir, vec3(1,0,0)));
    }
    vec3 bitangent = normalize(cross(dir, tangent));

    float tOff = aLocalPos.x; // -0.5 to 0.5
    float lFrac = aLocalPos.y; // 0 to 1

    // Tapered width
    float width = (1.0 - lFrac * 0.7) * 0.008;

    // Position along strand
    vec3 pos = aRootPos + deformedDir * lFrac * len;
    pos += tangent * tOff * width;

    vWorldPos = pos;
    vFog = length(pos - uCamPos) / 12.0;

    // Hair shading: light along the strand
    vec3 viewDir = normalize(uCamPos - pos);
    float hairLight = max(dot(deformedDir, uLightDir), 0.0) * 0.4 + 0.6;
    float sideLight = max(dot(tangent, uLightDir), 0.0) * 0.3;
    vBright = hairLight + sideLight;
    // Darken roots
    vBright *= 0.5 + 0.5 * lFrac;
    // Slight variation
    vBright *= 0.9 + 0.1 * phase;
}`;

const FS = `#version 300 es
precision highp float;

in vec3 vWorldPos;
in float vFog;
in float vBright;

out vec4 fragColor;

void main() {
    vec3 hairColor = vec3(0.72, 0.52, 0.32);
    vec3 col = hairColor * vBright;
    // Fog
    float fog = clamp(vFog, 0.0, 1.0);
    col = mix(col, vec3(0.02), fog * fog);
    fragColor = vec4(col, 1.0);
}`;

const COMP_FS = `#version 300 es
precision highp float;
in vec2 fragCoord;
out vec4 fragColor;
void main() { fragColor = vec4(0.02, 0.015, 0.03, 1.0); }`;

function compileShader(src, type) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(s));
        throw 0;
    }
    return s;
}

function createProgram(vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, compileShader(vs, gl.VERTEX_SHADER));
    gl.attachShader(p, compileShader(fs, gl.FRAGMENT_SHADER));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
        console.error(gl.getProgramInfoLog(p));
        throw 0;
    }
    return p;
}

const prog = createProgram(VS, FS);
const compProg = createProgram(`#version 300 es
precision highp float;
out vec4 fragColor;
void main() { fragColor = vec4(0.02, 0.015, 0.03, 1.0); }`, COMP_FS);

// --- Fibonacci sphere distribution ---
const PHI = (1 + Math.sqrt(5)) / 2;
const rootPos = new Float32Array(NUM_STRANDS * 3);
const rootNorm = new Float32Array(NUM_STRANDS * 3);
const strandLen = new Float32Array(NUM_STRANDS);
const phase = new Float32Array(NUM_STRANDS);

const RADIUS = 4.0; // 8 inches across = 4 radius
const HAIR_LEN = 0.5; // ~1 inch long (scaled)

for (let i = 0; i < NUM_STRANDS; i++) {
    const y = 1 - (i / (NUM_STRANDS - 1)) * 2;
    const r = Math.sqrt(1 - y * y);
    const theta = 2 * Math.PI * i / PHI;
    const x = Math.cos(theta) * r;
    const z = Math.sin(theta) * r;
    const idx3 = i * 3;
    rootPos[idx3] = x * RADIUS;
    rootPos[idx3 + 1] = y * RADIUS;
    rootPos[idx3 + 2] = z * RADIUS;
    rootNorm[idx3] = x;
    rootNorm[idx3 + 1] = y;
    rootNorm[idx3 + 2] = z;
    strandLen[i] = HAIR_LEN;
    phase[i] = Math.random();
}

// --- Strand geometry: 4 vertices per strand (quad) ---
// Each quad: (tangent_offset, length_frac)
// Vertex 0: (-0.5, 0) root-left
// Vertex 1: (0.5, 0) root-right
// Vertex 2: (-0.5, 1) tip-left
// Vertex 3: (0.5, 1) tip-right
const localPos = new Float32Array(TOTAL_VERTS * 2);
for (let i = 0; i < NUM_STRANDS; i++) {
    const base = i * STRAND_VERTS * 2;
    localPos[base] = -0.5; localPos[base+1] = 0.0;
    localPos[base+2] = 0.5; localPos[base+3] = 0.0;
    localPos[base+4] = -0.5; localPos[base+5] = 1.0;
    localPos[base+6] = 0.5; localPos[base+7] = 1.0;
}

// --- Buffers ---
const rootPosBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, rootPosBuf);
gl.bufferData(gl.ARRAY_BUFFER, rootPos, gl.STATIC_DRAW);

const rootNormBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, rootNormBuf);
gl.bufferData(gl.ARRAY_BUFFER, rootNorm, gl.STATIC_DRAW);

const strandLenBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, strandLenBuf);
gl.bufferData(gl.ARRAY_BUFFER, strandLen, gl.STATIC_DRAW);

const phaseBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, phase);
gl.bufferData(gl.ARRAY_BUFFER, phase, gl.STATIC_DRAW);

const localPosBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, localPosBuf);
gl.bufferData(gl.ARRAY_BUFFER, localPos, gl.STATIC_DRAW);

// --- Bend state texture ---
const TEX_SIZE = 1000;
const bendTexData = new Float32Array(TEX_SIZE * TEX_SIZE * 4);
// Initialize with bend_time = -100 (no bend)
for (let i = 0; i < TEX_SIZE * TEX_SIZE; i++) {
    bendTexData[i * 4 + 3] = -100.0;
}

const bendTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, bendTex);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, TEX_SIZE, TEX_SIZE, 0, gl.RGBA, gl.FLOAT, bendTexData);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

// --- VAO ---
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);

// aRootPos
gl.bindBuffer(gl.ARRAY_BUFFER, rootPosBuf);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
gl.vertexAttribDivisor(0, 1);

// aRootNorm
gl.bindBuffer(gl.ARRAY_BUFFER, rootNormBuf);
gl.enableVertexAttribArray(1);
gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);
gl.vertexAttribDivisor(1, 1);

// aLength
gl.bindBuffer(gl.ARRAY_BUFFER, strandLenBuf);
gl.enableVertexAttribArray(2);
gl.vertexAttribPointer(2, 1, gl.FLOAT, false, 0, 0);
gl.vertexAttribDivisor(2, 1);

// aPhase
gl.bindBuffer(gl.ARRAY_BUFFER, phaseBuf);
gl.enableVertexAttribArray(3);
gl.vertexAttribPointer(3, 1, gl.FLOAT, false, 0, 0);
gl.vertexAttribDivisor(3, 1);

// aLocalPos
gl.bindBuffer(gl.ARRAY_BUFFER, localPosBuf);
gl.enableVertexAttribArray(4);
gl.vertexAttribPointer(4, 2, gl.FLOAT, false, 0, 0);
gl.vertexAttribDivisor(4, 1);

gl.bindVertexArray(null);

// --- Matrix math ---
function perspective(fov, aspect, near, far) {
    const f = 1 / Math.tan(fov / 2);
    const nf = 1 / (near - far);
    return new Float32Array([
        f/aspect, 0, 0, 0,
        0, f, 0, 0,
        0, 0, (far+near)*nf, -1,
        0, 0, 2*far*near*nf, 0
    ]);
}

function lookAt(eye, center, up) {
    const zx = eye[0]-center[0], zy = eye[1]-center[1], zz = eye[2]-center[2];
    let len = 1/Math.sqrt(zx*zx+zy*zy+zz*zz);
    const z = [zx*len, zy*len, zz*len];
    const xx = up[1]*z[2]-up[2]*z[1], xy = up[2]*z[0]-up[0]*z[2], xz = up[0]*z[1]-up[1]*z[0];
    len = 1/Math.sqrt(xx*xx+xy*xy+xz*xz);
    const x = [xx*len, xy*len, xz*len];
    const y = [z[1]*x[2]-z[2]*x[1], z[2]*x[0]-z[0]*x[2], z[0]*x[1]-z[1]*x[0]];
    return new Float32Array([
        x[0],y[0],z[0],0,
        x[1],y[1],z[1],0,
        x[2],y[2],z[2],0,
        -(x[0]*eye[0]+x[1]*eye[1]+x[2]*eye[2]),
        -(y[0]*eye[0]+y[1]*eye[1]+y[2]*eye[2]),
        -(z[0]*eye[0]+z[1]*eye[1]+z[2]*eye[2]),
        1
    ]);
}

function multiply(a, b) {
    const o = new Float32Array(16);
    for (let i = 0; i < 4; i++)
        for (let j = 0; j < 4; j++) {
            o[j*4+i] = 0;
            for (let k = 0; k < 4; k++)
                o[j*4+i] += a[k*4+i] * b[j*4+k];
        }
    return o;
}

// --- Camera ---
let camTheta = 0.3, camPhi = 0.5, camDist = 10;
let isDragging = false, isRotating = false;
let lastMX = 0, lastMY = 0;
let mouseX = 0, mouseY = 0;
let dragVecX = 0, dragVecY = 0;
let time = 0;

// --- Mouse interaction ---
function screenToRay(sx, sy) {
    const aspect = canvas.width / canvas.height;
    const ndcX = (sx / canvas.width) * 2 - 1;
    const ndcY = -((sy / canvas.height) * 2 - 1);
    const invVP = invertMat4(vp);
    if (!invVP) return null;
    const near = transformPoint(invVP, [ndcX, ndcY, -1, 1]);
    const far = transformPoint(invVP, [ndcX, ndcY, 1, 1]);
    near[0] /= near[3]; near[1] /= near[3]; near[2] /= near[3];
    far[0] /= far[3]; far[1] /= far[3]; far[2] /= far[3];
    return { origin: [near[0], near[1], near[2]], dir: normalize3([far[0]-near[0], far[1]-near[1], far[2]-near[2]]) };
}

function invertMat4(m) {
    const inv = new Float32Array(16);
    const m00=m[0],m01=m[1],m02=m[2],m03=m[3],m10=m[4],m11=m[5],m12=m[6],m13=m[7];
    const m20=m[8],m21=m[9],m22=m[10],m23=m[11],m30=m[12],m31=m[13],m32=m[14],m33=m[15];
    const b00=m00*m11-m01*m10,b01=m00*m12-m02*m10,b02=m00*m13-m03*m10;
    const b03=m01*m12-m02*m11,b04=m01*m13-m03*m11,b05=m02*m13-m03*m12;
    const b06=m20*m31-m21*m30,b07=m20*m32-m22*m30,b08=m20*m33-m23*m30;
    const b09=m21*m32-m22*m31,b10=m21*m33-m23*m31,b11=m22*m33-m23*m32;
    let det=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;
    if(!det)return null;
    det=1.0/det;
    inv[0]=(m11*b11-m12*b10+m13*b09)*det;
    inv[1]=(m02*b10-m01*b11-m03*b09)*det;
    inv[2]=(m31*b05-m32*b04+m33*b03)*det;
    inv[3]=(m22*b04-m21*b05-m23*b03)*det;
    inv[4]=(m12*b08-m10*b11-m13*b07)*det;
    inv[5]=(m00*b11-m02*b08+m03*b07)*det;
    inv[6]=(m32*b02-m30*b05-m33*b01)*det;
    inv[7]=(m20*b05-m22*b02+m23*b01)*det;
    inv[8]=(m10*b10-m11*b08+m13*b06)*det;
    inv[9]=(m01*b08-m00*b10-m03*b06)*det;
    inv[10]=(m30*b04-m31*b02+m33*b00)*det;
    inv[11]=(m21*b02-m20*b04-m23*b00)*det;
    inv[12]=(m11*b07-m10*b09-m12*b06)*det;
    inv[13]=(m00*b09-m01*b07+m02*b06)*det;
    inv[14]=(m31*b01-m30*b03-m32*b00)*det;
    inv[15]=(m20*b03-m21*b01+m22*b00)*det;
    return inv;
}

function transformPoint(m, p) {
    return [
        m[0]*p[0]+m[4]*p[1]+m[8]*p[2]+m[12]*p[3],
        m[1]*p[0]+m[5]*p[1]+m[9]*p[2]+m[13]*p[3],
        m[2]*p[0]+m[6]*p[1]+m[10]*p[2]+m[14]*p[3],
        m[3]*p[0]+m[7]*p[1]+m[11]*p[2]+m[15]*p[3]
    ];
}

function normalize3(v) {
    const l = Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]);
    return l > 0 ? [v[0]/l, v[1]/l, v[2]/l] : [0,0,1];
}

function raySphereIntersect(origin, dir, center, radius) {
    const oc = [origin[0]-center[0], origin[1]-center[1], origin[2]-center[2]];
    const a = dir[0]*dir[0]+dir[1]*dir[1]+dir[2]*dir[2];
    const b = 2*(oc[0]*dir[0]+oc[1]*dir[1]+oc[2]*dir[2]);
    const c = oc[0]*oc[0]+oc[1]*oc[1]+oc[2]*oc[2]-radius*radius;
    const disc = b*b-4*a*c;
    if (disc < 0) return null;
    const t = (-b - Math.sqrt(disc)) / (2*a);
    if (t < 0) return null;
    return [origin[0]+dir[0]*t, origin[1]+dir[1]*t, origin[2]+dir[2]*t];
}

canvas.addEventListener("mousedown", (e) => {
    isDragging = true;
    isRotating = true;
    lastMX = e.clientX;
    lastMY = e.clientY;
    dragVecX = 0;
    dragVecY = 0;
});

canvas.addEventListener("mousemove", (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    if (!isDragging) return;
    const dx = e.clientX - lastMX;
    const dy = e.clientY - lastMY;
    lastMX = e.clientX;
    lastMY = e.clientY;

    if (isRotating) {
        camTheta -= dx * 0.005;
        camPhi -= dy * 0.005;
        camPhi = Math.max(-Math.PI/2+0.1, Math.min(Math.PI/2-0.1, camPhi));
    }

    // Pet the fur
    const ray = screenToRay(e.clientX, e.clientY);
    if (!ray) return;
    const hit = raySphereIntersect(ray.origin, ray.dir, [0,0,0], RADIUS + HAIR_LEN);
    if (!hit) return;

    // Find strands to bend
    const petRadius = 1.5;
    const petRadiusSq = petRadius * petRadius;
    const petStrength = 1.0;

    // Compute drag direction in world space
    const dragWorld = [dx, -dy, 0]; // screen space drag

    // Project drag onto tangent plane at hit point
    const hitNorm = normalize3(hit);
    // Create a basis at hit point
    let up = [0, 1, 0];
    if (Math.abs(hitNorm[0]*up[0]+hitNorm[1]*up[1]+hitNorm[2]*up[2]) > 0.9) up = [1, 0, 0];
    const tangent = normalize3([
        hitNorm[1]*up[2]-hitNorm[2]*up[1],
        hitNorm[2]*up[0]-hitNorm[0]*up[2],
        hitNorm[0]*up[1]-hitNorm[1]*up[0]
    ]);
    const bitangent = normalize3([
        hitNorm[1]*tangent[2]-hitNorm[2]*tangent[1],
        hitNorm[2]*tangent[0]-hitNorm[0]*tangent[2],
        hitNorm[0]*tangent[1]-hitNorm[1]*tangent[0]
    ]);

    // Scale drag by some factor
    const dragScale = 0.02;
    const bendDirWorld = [
        tangent[0]*dragWorld[0]*dragScale + bitangent[0]*dragWorld[1]*dragScale,
        tangent[1]*dragWorld[0]*dragScale + bitangent[1]*dragWorld[1]*dragScale,
        tangent[2]*dragWorld[0]*dragScale + bitangent[2]*dragWorld[1]*dragScale
    ];
    const bLen = Math.sqrt(bendDirWorld[0]**2+bendDirWorld[1]**2+bendDirWorld[2]**2);
    if (bLen < 0.0001) return;
    const bendDirNorm = [bendDirWorld[0]/bLen, bendDirWorld[1]/bLen, bendDirWorld[2]/bLen];

    // Update bend texture for nearby strands
    const updateRadius = 30; // pixels
    const colStart = Math.max(0, Math.floor((e.clientX / canvas.width) * TEX_SIZE) - updateRadius);
    const colEnd = Math.min(TEX_SIZE-1, Math.ceil((e.clientX / canvas.width) * TEX_SIZE) + updateRadius);
    const rowStart = Math.max(0, Math.floor((e.clientY / canvas.height) * TEX_SIZE) - updateRadius);
    const rowEnd = Math.min(TEX_SIZE-1, Math.ceil((e.clientY / canvas.height) * TEX_SIZE) + updateRadius);

    for (let row = rowStart; row <= rowEnd; row++) {
        for (let col = colStart; col <= colEnd; col++) {
            const idx = row * TEX_SIZE + col;
            const sx = (col / TEX_SIZE) * 2 - 1;
            const sy = 1 - (row / TEX_SIZE) * 2;
            const sr = Math.sqrt(1 - (sx*0.5)**2 - (sy*0.5)**2);
            const strandX = sx * RADIUS * 0.5;
            const strandY = sy * RADIUS * 0.5;
            const strandZ = sr * RADIUS * 0.5;
            // Approximate strand position (Fibonacci is not perfectly spherical in screen space)
            // Use a simpler approach: just check distance in screen space
            const screenDist = Math.sqrt((col - e.clientX/ canvas.width * TEX_SIZE)**2 + (row - e.clientY/ canvas.height * TEX_SIZE)**2);
            if (screenDist < updateRadius) {
                const falloff = 1 - screenDist / updateRadius;
                const strength = falloff * petStrength;
                bendTexData[idx * 4] = bendDirNorm[0] * strength;
                bendTexData[idx * 4 + 1] = bendDirNorm[1] * strength;
                bendTexData[idx * 4 + 2] = bendDirNorm[2] * strength;
                bendTexData[idx * 4 + 3] = time;
            }
        }
    }

    gl.bindTexture(gl.TEXTURE_2D, bendTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, TEX_SIZE, TEX_SIZE, gl.RGBA, gl.FLOAT, bendTexData);
});

canvas.addEventListener("mouseup", () => { isDragging = false; isRotating = false; });
canvas.addEventListener("mouseleave", () => { isDragging = false; isRotating = false; });

// Touch support
canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    const t = e.touches[0];
    isDragging = true;
    isRotating = true;
    lastMX = t.clientX;
    lastMY = t.clientY;
    dragVecX = 0;
    dragVecY = 0;
}, { passive: false });

canvas.addEventListener("touchmove", (e) => {
    e.preventDefault();
    const t = e.touches[0];
    mouseX = t.clientX;
    mouseY = t.clientY;
    if (!isDragging) return;
    const dx = t.clientX - lastMX;
    const dy = t.clientY - lastMY;
    lastMX = t.clientX;
    lastMY = t.clientY;

    if (isRotating) {
        camTheta -= dx * 0.005;
        camPhi -= dy * 0.005;
        camPhi = Math.max(-Math.PI/2+0.1, Math.min(Math.PI/2-0.1, camPhi));
    }

    const ray = screenToRay(t.clientX, t.clientY);
    if (!ray) return;
    const hit = raySphereIntersect(ray.origin, ray.dir, [0,0,0], RADIUS + HAIR_LEN);
    if (!hit) return;

    const updateRadius = 30;
    const colStart = Math.max(0, Math.floor((t.clientX / canvas.width) * TEX_SIZE) - updateRadius);
    const colEnd = Math.min(TEX_SIZE-1, Math.ceil((t.clientX / canvas.width) * TEX_SIZE) + updateRadius);
    const rowStart = Math.max(0, Math.floor((t.clientY / canvas.height) * TEX_SIZE) - updateRadius);
    const rowEnd = Math.min(TEX_SIZE-1, Math.ceil((t.clientY / canvas.height) * TEX_SIZE) + updateRadius);

    const dragWorld = [dx, -dy, 0];
    const hitNorm = normalize3(hit);
    let up = [0, 1, 0];
    if (Math.abs(hitNorm[0]*up[0]+hitNorm[1]*up[1]+hitNorm[2]*up[2]) > 0.9) up = [1, 0, 0];
    const tangent = normalize3([hitNorm[1]*up[2]-hitNorm[2]*up[1], hitNorm[2]*up[0]-hitNorm[0]*up[2], hitNorm[0]*up[1]-hitNorm[1]*up[0]]);
    const bitangent = normalize3([hitNorm[1]*tangent[2]-hitNorm[2]*tangent[1], hitNorm[2]*tangent[0]-hitNorm[0]*tangent[2], hitNorm[0]*tangent[1]-hitNorm[1]*tangent[0]]);

    const dragScale = 0.02;
    const bendDirWorld = [tangent[0]*dragWorld[0]*dragScale+bitangent[0]*dragWorld[1]*dragScale, tangent[1]*dragWorld[0]*dragScale+bitangent[1]*dragWorld[1]*dragScale, tangent[2]*dragWorld[0]*dragScale+bitangent[2]*dragWorld[1]*dragScale];
    const bLen = Math.sqrt(bendDirWorld[0]**2+bendDirWorld[1]**2+bendDirWorld[2]**2);
    if (bLen < 0.0001) return;
    const bendDirNorm = [bendDirWorld[0]/bLen, bendDirWorld[1]/bLen, bendDirWorld[2]/bLen];

    for (let row = rowStart; row <= rowEnd; row++) {
        for (let col = colStart; col <= colEnd; col++) {
            const idx = row * TEX_SIZE + col;
            const screenDist = Math.sqrt((col - t.clientX/ canvas.width * TEX_SIZE)**2 + (row - t.clientY/ canvas.height * TEX_SIZE)**2);
            if (screenDist < updateRadius) {
                const falloff = 1 - screenDist / updateRadius;
                const strength = falloff * 1.0;
                bendTexData[idx * 4] = bendDirNorm[0] * strength;
                bendTexData[idx * 4 + 1] = bendDirNorm[1] * strength;
                bendTexData[idx * 4 + 2] = bendDirNorm[2] * strength;
                bendTexData[idx * 4 + 3] = time;
            }
        }
    }

    gl.bindTexture(gl.TEXTURE_2D, bendTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, TEX_SIZE, TEX_SIZE, gl.RGBA, gl.FLOAT, bendTexData);
}, { passive: false });

canvas.addEventListener("touchend", () => { isDragging = false; isRotating = false; });

// --- Resize ---
function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener("resize", resize);
resize();

// --- Uniform locations ---
const uVP = gl.getUniformLocation(prog, "uVP");
const uTime = gl.getUniformLocation(prog, "uTime");
const uLightDir = gl.getUniformLocation(prog, "uLightDir");
const uCamPos = gl.getUniformLocation(prog, "uCamPos");
const uBendTex = gl.getUniformLocation(prog, "uBendTex");

// --- Render loop ---
let lastTime = 0;

function render(now) {
    now *= 0.001;
    const dt = now - lastTime;
    lastTime = now;
    time = now;

    resize();

    const aspect = canvas.width / canvas.height;
    const eyeX = camDist * Math.cos(camPhi) * Math.sin(camTheta);
    const eyeY = camDist * Math.sin(camPhi);
    const eyeZ = camDist * Math.cos(camPhi) * Math.cos(camTheta);
    const eye = [eyeX, eyeY, eyeZ];
    const vp = multiply(perspective(Math.PI / 4, aspect, 0.1, 100), lookAt(eye, [0, 0, 0], [0, 1, 0]));

    gl.clearColor(0.02, 0.015, 0.03, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.CULL_FACE);
    gl.cullFace(gl.BACK);

    gl.useProgram(prog);
    gl.uniformMatrix4fv(uVP, false, vp);
    gl.uniform1f(uTime, time);
    gl.uniform3f(uLightDir, 0.5, 0.8, 0.3);
    gl.uniform3fv(uCamPos, eye);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, bendTex);
    gl.uniform1i(uBendTex, 0);

    gl.bindVertexArray(vao);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, STRAND_VERTS, NUM_STRANDS);
    gl.bindVertexArray(null);

    requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>
